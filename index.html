<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRAB SHACK 3 — a beach economy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text x=%220%22 y=%2214%22 font-size=%2214%22>🦀</text></svg>">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #10182c;
    background-image: radial-gradient(ellipse at 50% 30%, #1c2a4a 0%, #10182c 70%);
    display: flex; align-items: center; justify-content: center;
    font-family: monospace;
  }
  .bezel {
    position: relative; padding: 14px;
    background: linear-gradient(160deg, #c8f5e4, #8fe3c4 55%, #4ec39a);
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.5);
  }
  canvas {
    display: block;
    width: min(92vw, calc(92vh * 256 / 240));
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; border-radius: 6px;
    cursor: grab;
  }
  .scan {
    position: absolute; inset: 14px; border-radius: 6px; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px);
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
  <div class="bezel">
    <canvas id="screen" width="256" height="240"></canvas>
    <div class="scan"></div>
  </div>
  <script src="font.js"></script>
  <script src="ppu.js"></script>
  <script src="sprites.js"></script>
  <script src="crabs.js"></script>
  <script src="game.js"></script>
</body>
</html>

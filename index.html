<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CRAB SHACK 3 — a beach economy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text x=%220%22 y=%2214%22 font-size=%2214%22>🦀</text></svg>">
<style>
  html, body {
    margin: 0; height: 100%; height: 100dvh;
    overscroll-behavior: none;            /* no pull-to-refresh while dragging the town */
    -webkit-text-size-adjust: 100%;
  }
  body {
    background: #10182c;
    background-image: radial-gradient(ellipse at 50% 30%, #1c2a4a 0%, #10182c 70%);
    display: flex; align-items: center; justify-content: center;
    font-family: monospace;
  }
  .bezel {
    position: relative; padding: 14px;
    background: linear-gradient(160deg, #c8f5e4, #8fe3c4 55%, #4ec39a);
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.5);
  }
  canvas {
    display: block;
    width: min(92vw, calc(92vh * 256 / 240));
    image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    background: #000; border-radius: 6px;
    cursor: grab;
  }
  .scan {
    position: absolute; inset: 14px; border-radius: 6px; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px);
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
  <div class="bezel">
    <canvas id="screen" width="256" height="240"></canvas>
    <div class="scan"></div>
  </div>
  <script>
    // Fit the screen to any viewport, preferring crisp half-pixel steps.
    // Portrait viewports get a taller 256x288 canvas (the extra rows go to the
    // UI panel - see game.js); landscape/desktop keep the classic 256x240.
    // Layout constants across the game files are consts derived from H at
    // parse time, so a mode flip on rotate reloads the page - the game saves
    // on beforeunload (and every 5s), so nothing is lost.
    (function () {
      const cv = document.getElementById("screen");
      const modeH = () => (innerHeight > innerWidth ? 288 : 240);
      const H = modeH();
      cv.height = H;
      window.SCREEN_H = H;                         // ppu.js picks this up
      function fit() {
        const small = Math.min(innerWidth, innerHeight) < 620;
        const pad = small ? 14 : 60;               // bezel padding + breathing room
        let s = Math.min((innerWidth - pad) / 256, (innerHeight - pad) / H);
        if (s >= 2) s = Math.floor(s * 2) / 2;     // crisp steps once there's room
        s = Math.max(s, 0.5);
        cv.style.width = Math.round(256 * s) + "px";
        cv.style.height = Math.round(H * s) + "px";
      }
      let flipT = 0;
      function refit() {
        fit();
        clearTimeout(flipT);                       // settle before deciding it's a real rotate
        if (modeH() !== H) flipT = setTimeout(() => { if (modeH() !== H) location.reload(); }, 250);
      }
      addEventListener("resize", refit);
      addEventListener("orientationchange", () => setTimeout(refit, 120));
      if (window.visualViewport) visualViewport.addEventListener("resize", refit);
      fit();
    })();
  </script>
  <script src="font.js"></script>
  <script src="ppu.js"></script>
  <script src="sprites.js"></script>
  <script src="crabs.js"></script>
  <script src="merge.js"></script>
  <script src="game.js"></script>
</body>
</html>
